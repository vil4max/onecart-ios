name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# PR runs cancel superseded runs; every push to main runs to completion in its own
# group, because a tf- or v tag needs a finished Tests run for that exact commit.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The app requires iOS 27, so the job needs the iOS 27 SDK. The GA macos-26 image
# tops out at Xcode 26.6 / iOS 26.5, so runs-on is the preview xcode-27 image — the
# only GitHub-hosted label that carries Xcode 27 (docs/decisions/0003-ci-split.md,
# "Runner image risk"). DEVELOPER_DIR names the versioned Xcode_27.0 symlink, not
# Xcode.app: if the image ever defaults to another Xcode, this fails loudly instead
# of silently testing against a different SDK.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
  SIMULATOR_NAME: iPhone 17
  SIMULATOR_OS: "27.0"
  XCODEBUILD_FLAGS: >-
    -project OneCart/OneCart.xcodeproj
    -scheme OneCart
    -configuration Debug
    -skipPackagePluginValidation
    -skipMacroValidation
    -enableCodeCoverage YES
    -parallel-testing-enabled NO
    CODE_SIGN_IDENTITY=-
    DEVELOPMENT_TEAM=

# Ad-hoc signing instead of CODE_SIGNING_ALLOWED=NO: an unsigned test host has no
# Keychain access, so AppleSignInTests keychain cases fail.
#
# GitHub Actions owns tests; Xcode Cloud archives only from the testflight branch,
# which only the TestFlight workflow moves, on a tf- tag
# (docs/decisions/0003-ci-split.md, docs/decisions/0004-tag-gated-testflight.md).
# A push to main promotes nothing. The project has no Swift packages, so there
# is no DerivedData cache: a fresh checkout rebuilds every source anyway.
jobs:
  unit-tests:
    name: Unit tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Boots in the background while the app builds.
      - name: Start simulator boot
        run: scripts/ci-boot-simulator.sh "$SIMULATOR_NAME" "$SIMULATOR_OS"

      - name: Build for testing
        run: |
          xcodebuild $XCODEBUILD_FLAGS -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" build-for-testing

      - name: Run tests
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild $XCODEBUILD_FLAGS -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath build/results/unit.xcresult \
            test-without-building

      - name: Coverage summary
        if: success()
        run: |
          {
            echo '## Coverage'
            echo '```'
            xcrun xccov view --report --only-targets build/results/unit.xcresult
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: build/results
          retention-days: 7
