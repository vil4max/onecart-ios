# Configuration of `ios-verify`, the gate of the ios-dev plugin.
# key=value, one per line; lines starting with # are comments.

# The OneCart scheme's Test action runs OneCartTests and the OneCartUITests smoke suite,
# so the default gate covers both; there is no separate UI scheme.
scheme=OneCart
project=OneCart/OneCart.xcodeproj

# This worktree's own simulator is created on demand from these.
device=iPhone 17
os=27.0

# iPhone only; the app and the widget extension share one App Group.
device_family=1
require_app_group=true

# The seeded owner demo cart (DEBUG only) for `ios-verify run-sim`; pass other
# -oneCartDemo* arguments after `--` for the member role or another tab.
run_args=-oneCartDemoUI -oneCartDemoRole owner

# Existing violations of the plugin's SwiftLint limits, recorded with `ios-verify baseline`;
# only new ones fail.
swiftlint_baseline=.swiftlint.baseline.json
