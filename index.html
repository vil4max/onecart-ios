<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f3" />
    <script>
      ;(() => {
        const themeColors = { light: '#f5f6f3', dark: '#111814' }
        let preference = 'light'

        try {
          const serialized = window.localStorage.getItem('onecart.app-state')
          const parsed = serialized ? JSON.parse(serialized) : null
          const state = parsed?.state ?? parsed
          const storedTheme = state?.settings?.theme
          if (storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system') {
            preference = storedTheme
          }
        } catch {
          // Keep the safe light fallback when local storage is unavailable or malformed.
        }

        const systemDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        const resolvedTheme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference

        document.documentElement.dataset.theme = resolvedTheme
        document.documentElement.style.colorScheme = resolvedTheme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', themeColors[resolvedTheme])
      })()
    </script>
    <meta name="description" content="OneCart — все списки покупок в одном приложении" />
    <link rel="icon" href="/onecart-app-icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>OneCart</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
